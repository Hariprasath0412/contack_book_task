<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>View contacts</title>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="style-page-2.css" />
    <link rel="stylesheet" href="style.css" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/x-icon" href="images/favicon.ico" />
  </head>
  <body>
    <!-- Header section -->
    <header class="header">
      <!-- Logo SVG -->
      <svg
        fill="#000000"
        version="1.1"
        id="Layer_1"
        xmlns="http://www.w3.org/2000/svg"
        xmlns:xlink="http://www.w3.org/1999/xlink"
        width="800px"
        height="800px"
        viewBox="0 0 72 72"
        enable-background="new 0 0 72 72"
        xml:space="preserve"
        class="contact-icon"
      >
        <g>
          <path
            d="M56.068,4H15.932C12.104,4,9,7.104,9,10.932v50.136C9,64.896,12.104,68,15.932,68h40.136C59.896,68,63,64.896,63,61.068

          />

            d="M55.245,47.951c0.26,0,0.521-0.102,0.71-0.29c0.18-0.19,0.29-0.44,0.29-0.71c0-0.262-0.111-0.521-0.302-0.71

          />
        </g>
      </svg>
      <h1 class="heading-name">Contact book</h1>

      <!-- Navigation links -->
      <nav>
        <a href="index.html"
          ><svg
            fill="#000000"
            width="800px"
            height="800px"
            viewBox="-3 0 19 19"
            xmlns="http://www.w3.org/2000/svg"
            class="cf-icon-svg nav-icon"
          >
            <path
              d="M12.711 9.182a1.03 1.03 0 0 1-1.03 1.03H7.53v4.152a1.03 1.03 0 0 1-2.058 0v-4.152H1.318a1.03 1.03 0 1 1 0-2.059h4.153V4.001a1.03 1.03 0 0 1 2.058 0v4.152h4.153a1.03 1.03 0 0 1 1.029 1.03z"
            />
          </svg>
          Add Contact</a
        >
        <a href="contact-page.html" class="view-contact-page"
          ><svg
            fill="#000000"
            width="800px"
            height="800px"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
            class="nav-icon"
          >
            <path
              d="M20,1H4A1,1,0,0,0,3,2V22a1,1,0,0,0,1,1H20a1,1,0,0,0,1-1V2A1,1,0,0,0,20,1ZM19,21H5V3H19ZM9,8.5a3,3,0,1,1,3,3A3,3,0,0,1,9,8.5Zm-2,9a5,5,0,0,1,10,0,1,1,0,0,1-2,0,3,3,0,0,0-6,0,1,1,0,0,1-2,0Z"
            />
          </svg>
          View Contacts</a
        >
      </nav>
    </header>

    <!-- Search and controls -->
    <section class="search">
      <input
        type="text"
        id="searching"
        class="searching-box"
        placeholder="Search your contacts"
      />
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="size-6 search-box-icon"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"
        />
      </svg>

      <!-- Filter dropdown -->
      <div class="filter-module">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="size-6 filter-icon"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M10.5 6h9.75M10.5 6a1.5 1.5 0 1 1-3 0m3 0a1.5 1.5 0 1 0-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-3.75 0H7.5m9-6h3.75m-3.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-9.75 0h9.75"
          />
        </svg>
        <select class="filter-search" id="filter-to">
          <option>Filter</option>
          <!-- <option>Oldest</option> -->
          <option>Starred</option>
        </select>
      </div>

      <!-- Sort dropdown -->
      <div class="sort-module">
        <svg
          width="800px"
          height="800px"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          class="sort-icon"
        >
          <path
            d="M13 12H21M13 8H21M13 16H21M6 7V17M6 7L3 10M6 7L9 10"
            stroke="#000000"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <select id="sort-by" class="filter-search sort-by">
          <option>Sort By</option>
          <option>A to Z</option>
          <option>Z to A</option>
        </select>
      </div>
    </section>

    <!-- Contacts List -->
    <main class="main-section">
      <!-- Toggle expand/collapse all details -->
      <input type="checkbox" id="all-toggle" class="display-none-input" />
      <button class="view-all-btn" id="view-all-btn" for="all-toggle">
        <span
          ><svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-6 tick-icon"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"
            />
          </svg> </span
        ><span> View All </span>
      </button>

      <table id="contact-table">
        <!-- Contact 1 -->
      </table>
    </main>
    <h2 id="no-contact-display">No contacts Found</h2>

    <!-- Form for editing the contacts -->
    <form id="edit-form" style="display: none">
      <!-- Editing name field -->
      <h2 id="edit-form-title" style="text-align: center">Edit Contact</h2>
      <div class="editing-input-fields">
        <label for="edit-person-name">Name</label>
        <br />
        <input
          type="text"
          id="edit-person-name"
          placeholder="Enter name "
          required
        />
        <p
          id="invalid-edit-name"
          class="invalids"
          style="display: none; color: red"
        >
          Enter Valid Name
        </p>
      </div>

      <!-- Editing email field -->
      <div class="editing-input-fields">
        <label for="edit-person-mail">Email</label>
        <br />
        <input
          type="email"
          id="edit-person-mail"
          placeholder="Enter email address"
          required
        />
        <p
          id="invalid-edit-email"
          class="invalids"
          style="display: none; color: red"
        >
          Enter Valid email
        </p>
      </div>

      <!-- Editing phone field -->
      <div class="editing-input-fields">
        <label for="edit-person-phone">Phone number</label>
        <br />
        <input
          type="tel"
          id="edit-person-phone"
          placeholder="Enter mobile no"
          required
        />
        <p
          id="invalid-edit-phone"
          class="invalids"
          style="display: none; color: red"
        >
          Enter Valid phone number
        </p>
      </div>

      <!-- Editing address field -->
      <div class="editing-input-fields address-field">
        <label for="edit-person-address">Address</label>
        <br />
        <textarea
          type="textarea"
          id="edit-person-address"
          placeholder="Enter Address here"
          required
        ></textarea>
      </div>

      <!-- Save and Cancel Buttons -->
      <div class="edit-form-btns">
        <button
          type="submit"
          id="edit-form-save-btn"
          class="edit--btn save-btn"
        >
          Save
        </button>
        <button
          type="button"
          id="edit-form-cancel-btn"
          class="edit--btn cancel-btn"
        >
          Cancel
        </button>
      </div>
    </form>

    <!--Overlay effect for focusing the edit form -->

    <div id="overlay-on" class="overlay hidden"></div>

    <!-- Asking for comfimation when delete buttton is clicked -->
    <div id="delete-sure-box" class="hidden">
      <p class="sure-msg">Are you sure you want to delete?</p>
      <div>
        <button class="delete-yes delete-btns">YES</button>
        <button class="delete-no delete-btns">NO</button>
      </div>
    </div>

    <script src="script2.js"></script>
  </body>
</html>
