    <!-- Search and controls -->
    <section class="search">
      <input
        type="text"
        id="searching"
        class="searching-box"
        placeholder="Search your contacts"
      />
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="size-6 search-box-icon"
      >

          stroke-linejoin="round"

        />
      </svg>

      <!-- Filter dropdown -->
      <div class="filter-module">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="size-6 filter-icon"
        >
          <path

            stroke-linejoin="round"

          />
        </svg>
        <select class="filter-search" id="filter-to">
          <option>Filter</option>
          <!-- <option>Oldest</option> -->
          <option>Starred</option>
        </select>
      </div>

      <!-- Sort dropdown -->
      <div class="sort-module">
        <svg
          width="800px"
          height="800px"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          class="sort-icon"
        >
          <path
            d="M13 12H21M13 8H21M13 16H21M6 7V17M6 7L3 10M6 7L9 10"
            stroke="#000000"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <select id="sort-by" class="filter-search sort-by">
          <option>Sort By</option>
          <option>A to Z</option>
          <option>Z to A</option>
        </select>
      </div>
    </section>

    <!-- Contacts List -->
    <main class="main-section">
      <!-- Toggle expand/collapse all details -->
      <input type="checkbox" id="all-toggle" class="display-none-input" />
      <label class="view-all-btn" for="all-toggle">
        <span

            xmlns="http://www.w3.org/2000/svg"

            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"

              d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"
            />
          </svg> </span
        ><span> View All </span>
      </label>

        style="width: 100%; height: 100%; overflow: scroll"

    <h2 id="no-contact-display">No contacts Yet</h2>

    <!-- Form for editing the contacts -->
    <form id="edit-form" style="display: none">
      <!-- Editing name field -->
      <div class="editing-input-fields">
        <label for="edit-person-name">Name</label>
        <br />
        <input
          type="text"
          id="edit-person-name"
          placeholder="Enter name "
          required
        />
        <p class="invalid-edit-name invalids" style="display: none; color: red">
          Name already registered
        </p>
      </div>

      <!-- Editing n field -->
      <div class="editing-input-fields">
        <label for="edit-person-mail">Email</label>
        <br />
        <input
          type="email"
          id="edit-person-mail"
          placeholder="Enter email address"
          required
        />
        <p
          class="invalid-edit-email invalids"
          style="display: none; color: red"
        >
          Enter Valid email
        </p>
      </div>

      <!-- Editing name field -->
      <div class="editing-input-fields">
        <label for="edit-person-phone">Phone number</label>
        <br />
        <input
          type="tel"
          id="edit-person-phone"
          placeholder="Enter mobile no"
          required
        />
        <p
          class="invalid-edit-phone invalids"
          style="display: none; color: red"
        >
          Enter Valid phone number
        </p>
      </div>

      <!-- Editing name field -->
      <div class="editing-input-fields address-field">
        <label for="edit-person-address">Address</label>
        <br />
        <textarea
          type="textarea"
          id="edit-person-address"
          placeholder="Enter Address here"
          required
        ></textarea>
      </div>

      <div class="edit-form-btns">
        <button
          type="submit"
          id="edit-form-save-btn"
          class="edit--btn save-btn"
        >
          Save
        </button>
        <button
          type="button"
          id="edit-form-cancel-btn"
          class="edit--btn cancel-btn"
        >
          Cancel
        </button>
      </div>
    </form>

    <div id="overlay-on" class="overlay hidden"></div>

    <!-- Asking for comfimation when delete buttton is clicked -->
    <div id="delete-sure-box" data-key-for-delete="" class="hidden">
      <p>Are you sure you want to delete?</p>
      <div>
        <button class="delete-yes delete-btns">YES</button>
        <button class="delete-no delete-btns">NO</button>
      </div>
    </div>
